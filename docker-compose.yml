version: '3.8'

services:
  # 1. Container chạy PHP 8.3 và Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: roombooking_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      # Mở cổng 5173 để hỗ trợ Vite (khi chạy npm run dev)
      - "5173:5173"
    depends_on:
      - db

  # 2. Container chạy Nginx Web Server
  web:
    image: nginx:alpine
    container_name: roombooking_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  # 3. Container chạy MySQL Database 8.0
  db:
    image: mysql:8.0
    container_name: roombooking_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      # Chấp nhận mật khẩu rỗng cho user root (Khớp với XAMPP)
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes" 
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Tự động nạp file SQL vào CSDL (Nhớ đảm bảo tên file SQL đúng với file thực tế)
      - ./room_booking.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: